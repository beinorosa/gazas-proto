<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straipsnis — Gazas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Schibsted+Grotesk:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="review.css?v=20261027z">
<script>if (location.search.includes("shot")) document.documentElement.classList.add("shot");</script>
<link rel="stylesheet" href="site.css?v=20261027z">
<style>
  .progress { position: fixed; inset: 0 0 auto; height: 3px; z-index: 60; pointer-events: none; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); }

  .article-layout { padding-top: 32px; }
  .article .crumbs { margin-bottom: 20px; }
  .article { max-width: 720px; }

  .a-kickers { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .article h1 { font: 700 44px/50px var(--heading); letter-spacing: -.015em; text-wrap: balance; }
  .article .dek { font-size: 21px; line-height: 31px; color: var(--text-secondary); margin-top: 16px; text-wrap: pretty; }

  .byline {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
    margin-top: 24px; padding: 16px 0; border-block: 1px solid var(--border-secondary);
  }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: #1f1f1f; color: #fff; font: 700 16px/1 var(--heading); grid-row: 1 / span 2; align-self: center; }
  .byline .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 14px; line-height: 20px; color: var(--text-tertiary); min-width: 0; }
  .byline .who strong { font-size: 16px; line-height: 22px; color: var(--text-primary); }
  .byline .when {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    font-size: 14px; line-height: 20px; color: var(--text-tertiary); font-variant-numeric: tabular-nums;
  }
  .byline .when .sep { width: 1px; height: 12px; background: var(--border-primary); flex: none; }

  .hero-fig { margin-top: 24px; }
  .hero-fig .img-frame { aspect-ratio: 16 / 9; }
  .hero-fig .img-frame.contain { background: #fff; border: 1px solid var(--border-secondary); }
  .hero-fig .img-frame.contain img { object-fit: contain; }
  figcaption { font-size: 14px; line-height: 20px; color: var(--text-tertiary); margin-top: 8px; }

  .context { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 16px; align-items: center; margin-top: 24px; padding: 16px; border-radius: var(--rounded-sm); background: var(--bg-tertiary); border-left: 4px solid var(--accent); }
  .context .label { grid-column: 1 / -1; font: 700 12px/16px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); }
  .context .ev { font-size: 18px; line-height: 24px; font-weight: 700; }
  .context .facts { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; line-height: 22px; color: var(--text-secondary); }
  .context .facts strong { color: var(--text-primary); }
  .context .actions { grid-column: 3; grid-row: 2 / span 2; display: flex; gap: 8px; }
  .context .btn { min-height: 40px; font-size: 14px; padding: 0 16px; }

  .prose { margin-top: 32px; }
  .prose > p:first-child { font-size: 21px; line-height: 33px; }
  .inline-related { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; padding: 16px 0; border-block: 1px solid var(--border-secondary); }
  .inline-related .img-frame { aspect-ratio: 16 / 10; border-radius: var(--rounded-xs); }
  .inline-related .lbl { font: 700 12px/16px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
  .inline-related .t { font-size: 17px; line-height: 23px; font-weight: 700; margin-top: 2px; }
  .prose .note { font-size: 15px; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; }
  .tags a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--border-primary); background: #fff; font-size: 15px; font-weight: 600; color: var(--text-secondary); }
  .tags a:hover { border-color: var(--text-primary); color: var(--text-primary); }
  .author-box { display: flex; gap: 16px; margin-top: 32px; padding: 20px; border-radius: var(--rounded-sm); background: #fff; box-shadow: var(--shadow-card); }
  .author-box p { font-size: 15px; line-height: 22px; color: var(--text-secondary); margin-top: 4px; }
  .author-box .report { display: inline-block; margin-top: 8px; font-size: 14px; color: var(--accent-text); font-weight: 600; }

  .mini-table { width: 100%; font-size: 15px; }
  .mini-table td { height: 40px; }

  @media (max-width: 1100px) {
    .layout-rail { grid-template-columns: minmax(0, 1fr); gap: 48px; }
    .article { max-width: none; }
    .side-rail.sticky { position: static; }
    .side-rail { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 760px) {
    .article-layout { padding-top: 16px; }
    .article h1 { font-size: 30px; line-height: 36px; }
    .article .dek { font-size: 18px; line-height: 27px; }
    .hero-fig { margin-inline: -16px; }
    .hero-fig .img-frame { border-radius: 0; }
    figcaption { padding-inline: 16px; }
    .context { grid-template-columns: 1fr; }
    .context .facts, .context .actions { grid-column: 1; grid-row: auto; }
    .prose { font-size: 18px; line-height: 29px; }
    .prose > p:first-child { font-size: 19px; line-height: 30px; }
    .prose blockquote { font-size: 21px; line-height: 30px; }
    .side-rail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Pereiti prie turinio</a>
<div class="progress" aria-hidden="true"><span></span></div>
<div data-site-header data-active="naujienos"></div>

<main id="main">
  <div class="wrap layout-rail article-layout">
    <article class="article" id="article"></article>
    <aside class="side-rail sticky" id="rail" aria-label="Papildoma informacija"></aside>
  </div>
  <section class="section wrap" aria-labelledby="more-title">
    <div class="section-head"><h2 id="more-title">Taip pat skaitykite</h2></div>
    <div class="grid4" id="more"></div>
  </section>
</main>

<div data-site-footer></div>
<script src="data.js?v=20261027z"></script>
<script src="site.js?v=20261027ab"></script>
<script>
  const G = window.GAZAS;
  const { fmt } = G;
  const id = new URLSearchParams(location.search).get("id");
  const a = G.byId[id] || G.ARTICLES[0];
  const s = G.SERIES[a.series];
  const author = G.AUTHORS[a.author];
  const ev = a.event && G.eventById[a.event];
  const st = G.STANDINGS[a.series];
  const who = a.athlete && G.athleteById[a.athlete];
  document.title = `${a.title} — Gazas`;

  const related = G.ARTICLES.filter((x) => x.id !== a.id).sort((x, y) => (y.series === a.series) - (x.series === a.series));
  const inline = related[0];

  const blocks = G.articleBody(a).map(([type, text, by], i) => {
    if (type === "h2") return `<h2>${text}</h2>`;
    if (type === "quote") return `<blockquote><p>${text}</p><cite>${by}</cite></blockquote>`;
    return `<p>${text}</p>`;
  });
  blocks.splice(2, 0, `
    <a class="inline-related hover-title" href="${G.href(inline)}">
      <div class="img-frame"><img src="assets/${inline.img}" alt=""></div>
      <div><p class="lbl">Taip pat skaitykite</p><p class="t">${inline.title}</p></div>
    </a>`);

  const session = ev && (ev.sessions.find(([, at]) => fmt.d(at) > G.now()) || ev.sessions[ev.sessions.length - 1]);
  const sessionWhen = session && `${fmt.DAYS[fmt.d(session[1]).getDay()]} ${fmt.time(session[1])}`;

  document.getElementById("article").innerHTML = `
    <nav aria-label="Naršymo kelias"><ol class="crumbs">
      <li><a href="improved.html">Pradžia</a></li>
      <li><a href="improved.html">${s.name}</a></li>
      <li><span aria-current="page">Straipsnis</span></li>
    </ol></nav>
    <header>
      <div class="a-kickers">
        <span class="badge" style="--c:${s.color}">${s.name}</span>
        ${a.label ? `<span class="badge outline">${a.label}</span>` : ""}
      </div>
      <h1>${a.title}</h1>
      <p class="dek">${a.dek}</p>
      <div class="byline">
        <span class="avatar" aria-hidden="true">${author.initials}</span>
        <span class="who"><strong>${author.name}</strong>${author.role}</span>
        <span class="when">
          <time datetime="2026-10-24T11:06">2026-10-24 11:06</time>
          <span class="sep" aria-hidden="true"></span>
          <span>${a.read} min. skaitymo</span>
        </span>
      </div>
    </header>
    <figure class="hero-fig">
      <div class="img-frame${a.contain ? " contain" : ""}"><img src="assets/${a.img}" alt=""></div>
      <figcaption>Nuotrauka: Gazas / organizatorių archyvas</figcaption>
    </figure>
    ${ev ? `
    <section class="context" aria-label="Susijęs renginys">
      <p class="label">Straipsnis apie renginį</p>
      <p class="ev">${ev.name}, ${ev.place}</p>
      <p class="facts"><span>${ev.round[0]} etapas iš ${ev.round[1]}</span><span>${session[0]}: <strong>${sessionWhen}</strong></span><span>Kur žiūrėti: <strong>${ev.watch}</strong></span></p>
      <div class="actions">
        <a class="btn btn-ghost" href="calendar.html#${ev.id}">Tvarkaraštis</a>
        ${st ? `<a class="btn btn-ghost" href="ratings.html?s=${a.series}">Lentelė</a>` : ""}
      </div>
    </section>` : ""}
    <div class="prose">${blocks.join("")}
      <p class="note meta">Rezultatai ir citatos yra demonstraciniai prototipo duomenys.</p>
    </div>
    <div class="tags" aria-label="Temos">
      <a href="improved.html">${s.name}</a>
      ${ev ? `<a href="calendar.html#${ev.id}">${ev.name}</a>` : ""}
      ${s.lt ? `<a href="calendar.html?r=lt">Lietuva</a>` : ""}
      ${who ? `<a href="athlete.html?id=${who.id}">${who.name}</a>` : ""}
    </div>
    <div class="author-box">
      <span class="avatar" aria-hidden="true">${author.initials}</span>
      <div><strong>${author.name}</strong><p>${author.role}. Rašo apie ${s.name} ir Lietuvos motorsportą.</p><a class="report" href="#">Pranešti apie klaidą</a></div>
    </div>`;

  const latest = G.ARTICLES.filter((x) => x.id !== a.id).slice(0, 5);
  const upcoming = G.EVENTS.filter((e) => fmt.d(e.end) >= G.now() && (e.series === a.series || e.country === "LT")).slice(0, 3);
  document.getElementById("rail").innerHTML = `${who ? `
    <section class="rail-block">
      <h2>Straipsnyje</h2>
      <a class="mini hover-title" href="athlete.html?id=${who.id}"><div class="img-frame round"><img src="assets/${who.img}" alt=""></div><div><p class="t">${who.name}</p><p class="meta"><span>${who.disc}</span></p></div></a>
    </section>` : ""}
    <section class="rail-block">
      <h2>Šviežiausios naujienos</h2>
      <div>${latest.map((x) => `
        <a class="mini hover-title" href="${G.href(x)}">
          <div class="img-frame${x.contain ? " contain" : ""}"><img src="assets/${x.img}" alt="" loading="lazy"></div>
          <div><p class="t">${x.title}</p><p class="meta"><span>${x.time}</span></p></div>
        </a>`).join("")}</div>
    </section>
    ${st ? `
    <section class="rail-block">
      <h2>${st.label} lentelė</h2>
      <table class="mini-table"><tbody>${st.drivers.slice(0, 5).map((d) => `<tr><td>${d.pos}</td><td>${d.name}<span class="team">${d.team}</span></td><td>${d.points}</td></tr>`).join("")}</tbody></table>
      <a class="more-link" href="ratings.html?s=${a.series}">Visa lentelė ${G.arrowRed}</a>
    </section>` : ""}
    <section class="rail-block">
      <h2>Artimiausi renginiai</h2>
      ${upcoming.map((e) => `<a class="next-ev hover-title" href="calendar.html#${e.id}"><span class="kicker">${G.SERIES[e.series].name}</span><span class="name t">${e.name}</span><span class="when">${fmt.range(e.start, e.end)}, ${e.place}</span></a>`).join("")}
      <a class="more-link" href="calendar.html">Visas kalendorius ${G.arrowRed}</a>
    </section>`;

  document.getElementById("more").innerHTML = related.slice(1, 5).map((x) => G.card(x)).join("");

  const bar = document.querySelector(".progress span");
  const art = document.getElementById("article");
  const onScroll = () => {
    const r = art.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
    bar.style.width = `${p * 100}%`;
  };
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();
</script>
</body>
</html>
